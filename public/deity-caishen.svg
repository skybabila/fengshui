<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="caishen-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FFA500"/>
      <stop offset="100%" style="stop-color:#FF8C00"/>
    </linearGradient>
    <linearGradient id="caishen-robe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B0000"/>
      <stop offset="100%" style="stop-color:#5C0000"/>
    </linearGradient>
    <radialGradient id="caishen-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- Glow effect -->
  <circle cx="100" cy="100" r="90" fill="url(#caishen-glow)"/>
  <!-- Background decoration -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#caishen-gold)" stroke-width="2" opacity="0.5"/>
  <!-- Fortune symbol -->
  <text x="100" y="45" font-size="28" fill="#FFD700" text-anchor="middle" font-family="serif">福</text>
  <!-- Robe body -->
  <path d="M45 185 Q100 135 155 185 L150 95 Q100 85 50 95 Z" fill="url(#caishen-robe)"/>
  <!-- Decorative patterns on robe -->
  <path d="M70 120 Q100 115 130 120" stroke="#FFD700" stroke-width="2" fill="none"/>
  <path d="M75 140 Q100 135 125 140" stroke="#FFD700" stroke-width="2" fill="none"/>
  <!-- Belt -->
  <rect x="55" y="110" width="90" height="8" rx="2" fill="url(#caishen-gold)"/>
  <!-- Head -->
  <circle cx="100" cy="72" r="32" fill="#FFE4C4"/>
  <!-- Hat -->
  <path d="M58 62 L100 15 L142 62 Q100 52 58 62" fill="url(#caishen-gold)"/>
  <rect x="62" y="58" width="76" height="8" fill="url(#caishen-gold)"/>
  <!-- Hat decoration -->
  <circle cx="100" cy="18" r="5" fill="#FF6347"/>
  <!-- Face -->
  <ellipse cx="88" cy="70" rx="5" ry="4" fill="#333"/>
  <ellipse cx="112" cy="70" rx="5" ry="4" fill="#333"/>
  <!-- Happy eyes -->
  <path d="M83 68 Q88 65 93 68" stroke="#333" stroke-width="2" fill="none"/>
  <path d="M107 68 Q112 65 117 68" stroke="#333" stroke-width="2" fill="none"/>
  <!-- Rosy cheeks -->
  <circle cx="78" cy="78" r="6" fill="#FFB6C1" opacity="0.5"/>
  <circle cx="122" cy="78" r="6" fill="#FFB6C1" opacity="0.5"/>
  <!-- Beard -->
  <path d="M80 88 Q100 125 120 88" fill="#E0E0E0" opacity="0.9"/>
  <!-- Smile -->
  <path d="M90 85 Q100 92 110 85" stroke="#333" stroke-width="2" fill="none"/>
  <!-- Gold ingots left -->
  <rect x="40" y="130" width="28" height="18" rx="3" fill="url(#caishen-gold)"/>
  <text x="54" y="143" font-size="11" fill="#8B4513" text-anchor="middle" font-weight="bold">财</text>
  <!-- Gold ingots right -->
  <rect x="132" y="130" width="28" height="18" rx="3" fill="url(#caishen-gold)"/>
  <text x="146" y="143" font-size="11" fill="#8B4513" text-anchor="middle" font-weight="bold">宝</text>
  <!-- Ruyi scepter -->
  <path d="M160 100 Q175 80 170 60" stroke="url(#caishen-gold)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="170" cy="55" r="10" fill="url(#caishen-gold)"/>
</svg>