<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="longevity-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E8B57"/>
      <stop offset="100%" style="stop-color:#006400"/>
    </linearGradient>
    <linearGradient id="longevity-peach" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB6C1"/>
      <stop offset="100%" style="stop-color:#FF69B4"/>
    </linearGradient>
    <radialGradient id="longevity-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#2E8B57;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#2E8B57;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- Glow effect -->
  <circle cx="100" cy="100" r="90" fill="url(#longevity-glow)"/>
  <!-- Background decoration -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#2E8B57" stroke-width="2" opacity="0.5"/>
  <!-- Longevity symbol -->
  <text x="100" y="42" font-size="24" fill="#2E8B57" text-anchor="middle" font-family="serif" font-weight="bold">寿</text>
  <!-- Robe body -->
  <path d="M45 185 Q100 135 155 185 L150 95 Q100 85 50 95 Z" fill="url(#longevity-emerald)"/>
  <!-- Decorative trim -->
  <path d="M65 115 Q100 110 135 115" stroke="#FFD700" stroke-width="2" fill="none"/>
  <path d="M60 135 Q100 130 140 135" stroke="#FFD700" stroke-width="2" fill="none"/>
  <!-- Belt -->
  <rect x="55" y="108" width="90" height="8" rx="2" fill="#FFD700"/>
  <!-- Head -->
  <circle cx="100" cy="72" r="32" fill="#FFE4C4"/>
  <!-- Wise face -->
  <ellipse cx="88" cy="70" rx="5" ry="4" fill="#333"/>
  <ellipse cx="112" cy="70" rx="5" ry="4" fill="#333"/>
  <!-- Wise eyebrows -->
  <path d="M78 62 Q88 56 96 62" stroke="#333" stroke-width="2" fill="none"/>
  <path d="M104 62 Q112 56 122 62" stroke="#333" stroke-width="2" fill="none"/>
  <!-- Wrinkles -->
  <path d="M82 75 Q88 77 94 75" stroke="#ccc" stroke-width="1" fill="none"/>
  <path d="M106 75 Q112 77 118 75" stroke="#ccc" stroke-width="1" fill="none"/>
  <!-- Mustache -->
  <path d="M80 82 Q100 90 120 82" fill="#E0E0E0"/>
  <!-- Smile -->
  <path d="M90 86 Q100 94 110 86" stroke="#333" stroke-width="2" fill="none"/>
  <!-- Hat -->
  <path d="M55 55 L100 28 L145 55 Q100 48 55 55" fill="#FFD700"/>
  <rect x="60" y="52" width="80" height="6" fill="#FFD700"/>
  <!-- Hat decoration - peach -->
  <ellipse cx="100" cy="32" rx="8" ry="7" fill="url(#longevity-peach)"/>
  <path d="M100 25 Q105 28 100 32" stroke="#228B22" stroke-width="2" fill="none"/>
  <!-- Peach of immortality left -->
  <ellipse cx="45" cy="130" rx="14" ry="12" fill="url(#longevity-peach)"/>
  <ellipse cx="45" cy="130" rx="8" ry="7" fill="#FFB6C1"/>
  <path d="M42 118 Q48 122 45 130" stroke="#228B22" stroke-width="2" fill="none"/>
  <!-- Peach of immortality right -->
  <ellipse cx="155" cy="135" rx="12" ry="10" fill="url(#longevity-peach)"/>
  <ellipse cx="155" cy="135" rx="6" ry="5" fill="#FFB6C1"/>
  <path d="M153 125 Q158 130 155 135" stroke="#228B22" stroke-width="2" fill="none"/>
  <!-- Staff/Cane -->
  <path d="M165 100 Q175 90 170 70" stroke="#8B4513" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="170" cy="65" r="8" fill="#FFD700"/>
  <!-- Deer antler Fungus (lingzhi) decoration -->
  <path d="M30 150 Q35 140 32 130 Q38 135 35 145 Q40 138 38 150" fill="#DC143C" opacity="0.8"/>
  <path d="M35 155 Q32 148 36 142 Q30 148 35 155" fill="#228B22" opacity="0.8"/>
</svg>