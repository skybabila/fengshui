<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="peach" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB6C1"/>
      <stop offset="100%" style="stop-color:#FF69B4"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#E0FFFF" opacity="0.4"/>
  <!-- Robe -->
  <path d="M55 180 Q100 140 145 180 L140 100 Q100 90 60 100 Z" fill="#87CEEB"/>
  <!-- Head -->
  <circle cx="100" cy="80" r="38" fill="#FFE4C4"/>
  <!-- Very long white beard -->
  <path d="M70 95 Q60 150 80 190 Q100 200 120 190 Q140 150 130 95" fill="#FFFFFF" stroke="#DDD" stroke-width="1"/>
  <!-- Eyes -->
  <ellipse cx="88" cy="78" rx="5" ry="4" fill="#333"/>
  <ellipse cx="112" cy="78" rx="5" ry="4" fill="#333"/>
  <!-- Happy eyebrows -->
  <path d="M80 68 Q88 64 96 68" stroke="#333" stroke-width="2" fill="none"/>
  <path d="M104 68 Q112 64 120 68" stroke="#333" stroke-width="2" fill="none"/>
  <!-- Smile -->
  <path d="M85 92 Q100 102 115 92" stroke="#333" stroke-width="2" fill="none"/>
  <!-- Hat -->
  <ellipse cx="100" cy="48" rx="30" ry="12" fill="#FFD700"/>
  <circle cx="100" cy="35" r="15" fill="#FFD700"/>
  <!-- Peach -->
  <ellipse cx="145" cy="130" rx="18" ry="22" fill="url(#peach)"/>
  <path d="M145 108 Q150 100 148 108" stroke="#228B22" stroke-width="3" fill="none"/>
  <ellipse cx="145" cy="130" rx="14" ry="18" fill="url(#peach)" opacity="0.5"/>
  <!-- Walking stick -->
  <rect x="40" y="80" width="6" height="100" fill="#8B4513" rx="3"/>
  <path d="M35 80 Q40 70 43 80" stroke="#8B4513" stroke-width="4" fill="none"/>
</svg>