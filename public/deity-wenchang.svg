<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="wenchang-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00CED1"/>
      <stop offset="100%" style="stop-color:#008B8B"/>
    </linearGradient>
    <linearGradient id="wenchang-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9370DB"/>
      <stop offset="100%" style="stop-color:#4B0082"/>
    </linearGradient>
    <radialGradient id="wenchang-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00CED1;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00CED1;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- Glow effect -->
  <circle cx="100" cy="100" r="90" fill="url(#wenchang-glow)"/>
  <!-- Background decoration -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#00CED1" stroke-width="2" opacity="0.5"/>
  <!-- Scholarly symbol -->
  <text x="100" y="42" font-size="22" fill="#008B8B" text-anchor="middle" font-family="serif" font-weight="bold">文</text>
  <!-- Robe body -->
  <path d="M45 185 Q100 135 155 185 L150 95 Q100 85 50 95 Z" fill="url(#wenchang-purple)"/>
  <!-- Decorative trim -->
  <path d="M65 115 Q100 110 135 115" stroke="#FFD700" stroke-width="2" fill="none"/>
  <path d="M60 135 Q100 130 140 135" stroke="#FFD700" stroke-width="2" fill="none"/>
  <!-- Belt -->
  <rect x="55" y="108" width="90" height="8" rx="2" fill="#00CED1"/>
  <!-- Head -->
  <circle cx="100" cy="72" r="32" fill="#FFE4C4"/>
  <!-- Wise face -->
  <ellipse cx="88" cy="70" rx="5" ry="4" fill="#333"/>
  <ellipse cx="112" cy="70" rx="5" ry="4" fill="#333"/>
  <!-- Scholarly eyebrows -->
  <path d="M78 62 Q88 56 96 62" stroke="#333" stroke-width="2" fill="none"/>
  <path d="M104 62 Q112 56 122 62" stroke="#333" stroke-width="2" fill="none"/>
  <!-- Wrinkles -->
  <path d="M82 76 Q88 78 94 76" stroke="#ccc" stroke-width="1" fill="none"/>
  <path d="M106 76 Q112 78 118 76" stroke="#ccc" stroke-width="1" fill="none"/>
  <!-- Beard -->
  <path d="M80 84 Q100 100 120 84" fill="#E0E0E0" opacity="0.9"/>
  <!-- Gentle smile -->
  <path d="M92 88 Q100 94 108 88" stroke="#333" stroke-width="2" fill="none"/>
  <!-- Scholar hat -->
  <path d="M50 58 L100 30 L150 58 Q100 50 50 58" fill="url(#wenchang-cyan)"/>
  <rect x="55" y="55" width="90" height="6" fill="url(#wenchang-cyan)"/>
  <!-- Hat decoration -->
  <rect x="95" y="20" width="10" height="15" fill="#FFD700"/>
  <circle cx="100" cy="18" r="5" fill="#FFD700"/>
  <!-- Scroll left -->
  <rect x="30" y="115" width="28" height="55" rx="2" fill="#F5DEB3"/>
  <rect x="28" y="115" width="4" height="55" fill="#8B4513"/>
  <rect x="56" y="115" width="4" height="55" fill="#8B4513"/>
  <text x="44" y="135" font-size="8" fill="#8B4513" text-anchor="middle" transform="rotate(-90, 44, 135)">学</text>
  <text x="44" y="155" font-size="8" fill="#8B4513" text-anchor="middle" transform="rotate(-90, 44, 155)">业</text>
  <!-- Brush right -->
  <rect x="155" y="110" width="6" height="70" rx="1" fill="#8B4513"/>
  <ellipse cx="158" cy="108" rx="5" ry="8" fill="#1a1a1a"/>
  <!-- Ink stone -->
  <ellipse cx="160" cy="175" rx="18" ry="8" fill="#333"/>
  <ellipse cx="160" cy="173" rx="14" ry="6" fill="#1a1a1a"/>
  <!-- Ink -->
  <ellipse cx="160" cy="172" rx="8" ry="3" fill="#0a0a0a"/>
  <!-- Star decorations -->
  <polygon points="55,175 57,181 63,181 58,185 60,191 55,187 50,191 52,185 47,181 53,181" fill="#FFD700" opacity="0.7"/>
  <polygon points="145,178 146,182 150,182 147,185 148,189 145,187 142,189 143,185 140,182 144,182" fill="#FFD700" opacity="0.7"/>
  <!-- Auspicious cloud -->
  <ellipse cx="140" cy="60" rx="15" ry="8" fill="#FFFACD" opacity="0.6"/>
  <ellipse cx="130" cy="55" rx="10" ry="6" fill="#FFFACD" opacity="0.6"/>
  <ellipse cx="150" cy="58" rx="8" ry="5" fill="#FFFACD" opacity="0.6"/>
</svg>