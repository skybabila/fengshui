<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4169E1"/>
      <stop offset="100%" style="stop-color:#0000CD"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#ADD8E6" opacity="0.3"/>
  <!-- Robe -->
  <path d="M55 180 Q100 140 145 180 L140 100 Q100 90 60 100 Z" fill="url(#blue)"/>
  <!-- Head -->
  <circle cx="100" cy="78" r="35" fill="#FFE4C4"/>
  <!-- Scholar cap -->
  <path d="M55 60 L100 30 L145 60 Q100 52 55 60" fill="#000080"/>
  <rect x="65" y="55" width="70" height="10" fill="#000080"/>
  <!-- Cap decorations hanging down -->
  <rect x="70" y="65" width="4" height="20" fill="#FFD700"/>
  <rect x="88" y="65" width="4" height="25" fill="#FFD700"/>
  <rect x="108" y="65" width="4" height="25" fill="#FFD700"/>
  <rect x="126" y="65" width="4" height="20" fill="#FFD700"/>
  <!-- Eyes -->
  <ellipse cx="88" cy="76" rx="5" ry="4" fill="#333"/>
  <ellipse cx="112" cy="76" rx="5" ry="4" fill="#333"/>
  <!-- Scholarly eyebrows -->
  <path d="M78 66 Q88 62 98 66" stroke="#333" stroke-width="2" fill="none"/>
  <path d="M102 66 Q112 62 122 66" stroke="#333" stroke-width="2" fill="none"/>
  <!-- Beard -->
  <path d="M78 88 Q100 115 122 88" fill="#333"/>
  <!-- Scroll -->
  <rect x="135" y="95" width="30" height="50" fill="#F5DEB3" rx="3"/>
  <ellipse cx="135" cy="95" rx="5" ry="8" fill="#DEB887"/>
  <ellipse cx="135" cy="145" rx="5" ry="8" fill="#DEB887"/>
  <line x1="140" y1="105" x2="160" y2="105" stroke="#8B4513" stroke-width="1"/>
  <line x1="140" y1="115" x2="160" y2="115" stroke="#8B4513" stroke-width="1"/>
  <line x1="140" y1="125" x2="155" y2="125" stroke="#8B4513" stroke-width="1"/>
  <!-- Writing brush in hand -->
  <rect x="35" y="110" width="5" height="60" fill="#8B4513" rx="2"/>
  <path d="M35 110 Q30 100 37 105" fill="#333"/>
</svg>